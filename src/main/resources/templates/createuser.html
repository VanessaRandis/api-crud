<!DOCTYPE html>
<html lang="pt-br">
<html xmlns:th="//www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>Bem vindo ao cadastro de Usuário</h1>
    </header>
    <main>

        <form method="POST" action="/user/novo" th:object="${userModel}">
                <input type="hidden" th:value="${userModel.id}" name="id" />

                <div>
                    <label for="name">Nome:</label>
                    <input type="text" id="name" th:field="${userModel.nome}">
                </div>
                <div>
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" th:value="${{userModel.email}}">
                </div>
                <div>
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" id="cpf" th:value="${{userModel.cpf}}">
                </div>
                <div>
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" id="username" name="username" th:value="${userModel.username}">
                </div>
                <div>
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" th:value="${{userModel.telefone}}">
                </div>
                <div>
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" id="senha" name="senha" th:value="${{userModel.senha}}">
                </div>
                <div>
                    <button type="submit" class="btn">Cadastrar</button>
                </div>

        </form>
    </main>
    <footer>
        <p>Vanessa Randis</p>
    </footer>
    <script src="/js/script-createuser.js"></script>
    
</body>
</html>
